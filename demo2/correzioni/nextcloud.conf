# Nextcloud, oltre al plugin: i file caricati non sono form.
#
# Coraza legge come form (application/x-www-form-urlencoded) anche un corpo
# senza Content-Type o con un tipo che non conosce, come image/jpeg: il
# contenuto del file finisce in ARGS_NAMES e le regole lo leggono come testo.
# Una foto accende piu' di dieci regole, una riga di SQL in un file .sql la 942100.
# Misurato in demo2, profilo plugin.
#
# Il rimedio: sui caricamenti WebDAV (PUT sotto /remote.php/dav/) il corpo non
# lo legge. Gli header e il percorso restano controllati.
SecRule REQUEST_FILENAME "@beginsWith /remote.php/dav/" \
    "id:1000100,phase:1,pass,nolog,t:none,chain"
    SecRule REQUEST_METHOD "@streq PUT" "t:none,ctl:requestBodyAccess=Off"
