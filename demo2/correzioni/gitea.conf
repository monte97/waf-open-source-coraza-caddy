# Gitea: git via HTTP e testo delle issue.
#
# git clone e git push passano da /<utente>/<repo>.git/info/refs e
# .../git-upload-pack: la 930130 ci vede ".git/", un file riservato, e blocca.
# Qui ".git" e' il nome del repository, non la cartella nascosta di un sito.
SecRule REQUEST_FILENAME "@rx ^/[^/]+/[^/]+\.git/(?:info/refs|git-upload-pack|git-receive-pack)$" \
    "id:1000200,phase:1,pass,nolog,t:none,ctl:ruleRemoveById=930130"

# git push manda il pacchetto con Content-Type application/x-git-receive-pack-request,
# che non e' fra i tipi ammessi (920420), ed e' binario: il corpo non si legge.
SecRule REQUEST_FILENAME "@rx ^/[^/]+/[^/]+\.git/git-(?:upload|receive)-pack$" \
    "id:1000201,phase:1,pass,nolog,t:none,ctl:ruleRemoveById=920420,ctl:requestBodyAccess=Off"

# Il testo di issue e commenti: chi scrive di codice ci mette query e comandi.
# Le regole d'attacco smettono di guardare il campo body del JSON, solo li'.
SecRule REQUEST_FILENAME "@rx ^/api/v1/repos/[^/]+/[^/]+/issues(?:/[0-9]+/comments)?$" \
    "id:1000202,phase:1,pass,nolog,t:none,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.body"
