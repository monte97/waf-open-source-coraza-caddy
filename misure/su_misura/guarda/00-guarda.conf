# Fase «guarda» del WAF su misura: livello 3, ma soglia altissima. Il WAF
# controlla tutto e annota nel registro, senza bloccare nessuno. E' il metodo
# della documentazione CRS (Anomaly Scoring): «start in blocking mode from the
# very beginning with very high anomaly score thresholds».
SecAction "id:900000,phase:1,nolog,pass,t:none,setvar:tx.blocking_paranoia_level=3,setvar:tx.detection_paranoia_level=3"
SecAction "id:900110,phase:1,nolog,pass,t:none,setvar:tx.inbound_anomaly_score_threshold=10000,setvar:tx.outbound_anomaly_score_threshold=10000"
