# DOPO le regole: una toppa su misura, mentre si aggiorna PHP.
#
# PHP2Shell (CVE-2026-109618 e CVE-2026-109619, corrette il 21/10/2026).
# Il CRS 4.30 a livello 1 non riconosce la FORMA della richiesta: misurato con
# `make block && make php2shell`, passa tutto. Queste due regole sono ispirate
# alle regole personalizzate proposte da AWS per il proprio WAF (21/10/2026), e
# valgono solo sul servizio PHP, sotto /php/.
#
# NON e' una correzione: l'unica correzione e' aggiornare PHP. Compra tempo.

# 1. Il campo che serve a CVE-2026-109619: l'avanzamento del caricamento
#    della sessione. Un modulo normale non lo manda.
SecRule REQUEST_URI "@beginsWith /php/" \
    "id:1000,phase:2,deny,status:403,log,msg:'PHP2Shell: campo PHP_SESSION_UPLOAD_PROGRESS',chain"
    SecRule ARGS_POST_NAMES "@streq PHP_SESSION_UPLOAD_PROGRESS" "t:none"

# 2. Gli user agent dei PoC pubblici. Il CRS li ha aggiunti il 22/10/2026
#    (coreruleset PR #4893), ma non sono ancora in una versione rilasciata.
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)php2shell" \
    "id:1001,phase:1,deny,status:403,log,msg:'PHP2Shell: user agent di un PoC'"
