# DOPO le regole: guardare anche dentro il Base64.
#
# Il CRS non decodifica il Base64, di proposito: decodificare ogni stringa
# trasforma il testo normale in byte a caso, e i falsi allarmi salgono. Qui lo
# facciamo solo sui valori che HANNO LA FORMA del Base64 (almeno 12 caratteri
# dell'alfabeto Base64, niente spazi), e sul risultato cerchiamo le famiglie
# piu' comuni. Le regole stanno dopo il CRS, quindi non sommano punti: bloccano
# subito.

# SQL injection e XSS: gli stessi rilevatori del CRS (libinjection).
SecRule ARGS "@rx ^[A-Za-z0-9+/_-]{12,}={0,2}$" \
    "id:1100,phase:2,deny,status:403,log,msg:'SQL injection dentro un valore Base64',t:none,chain"
    SecRule MATCHED_VAR "@detectSQLi" "t:base64Decode"

SecRule ARGS "@rx ^[A-Za-z0-9+/_-]{12,}={0,2}$" \
    "id:1101,phase:2,deny,status:403,log,msg:'XSS dentro un valore Base64',t:none,chain"
    SecRule MATCHED_VAR "@detectXSS" "t:base64Decode"

# Percorsi di sistema, codice PHP, Log4Shell, comandi di shell: le forme piu'
# frequenti degli attacchi a strascico.
SecRule ARGS "@rx ^[A-Za-z0-9+/_-]{12,}={0,2}$" \
    "id:1102,phase:2,deny,status:403,log,msg:'Attacco noto dentro un valore Base64',t:none,chain"
    SecRule MATCHED_VAR "@rx (?i)(?:\.\./|/etc/(?:passwd|shadow)|<\?php|\$\{jndi:|;\s*(?:cat|id|ls|wget|curl|sh|bash)\b|\|\s*(?:sh|bash)\b|<script|javascript:|\bunion\b.{0,20}\bselect\b)" "t:base64Decode"

# Le famiglie che il CRS copre meno e che i rilevatori qui sopra non vedono:
# LDAP, NoSQL, template lato server, Server Side Include, comandi di posta.
SecRule ARGS "@rx ^[A-Za-z0-9+/_-]{12,}={0,2}$" \
    "id:1103,phase:2,deny,status:403,log,msg:'Iniezione LDAP, NoSQL, template o posta dentro un valore Base64',t:none,chain"
    SecRule MATCHED_VAR "@rx (?i)(?:\(\s*[&|!]\s*\(|objectclass\s*=\s*\*|userpassword|\$(?:ne|gt|lt|gte|lte|where|regex|in|nin)\b|\bdb\.\w+\.\w+\(|\{\{.*\}\}|\$\{.*\}|<%.*%>|#\{.*\}|<!--\s*#\s*(?:exec|include|echo|config)|[\r\n]\s*(?:rcpt to|mail from|data|quit|bcc|cc)\b|[\r\n]\s*\w+\s+(?:fetch|capability|login|select)\b)" "t:base64Decode"

# Lo stesso controllo sui pezzi del percorso: /qualcosa/<base64>/...
SecRule REQUEST_FILENAME "@rx /([A-Za-z0-9+_-]{12,}={0,2})(?:/|$)" \
    "id:1104,phase:2,deny,status:403,log,msg:'Attacco dentro un pezzo di percorso in Base64',t:none,capture,chain"
    SecRule TX:1 "@rx (?i)(?:\.\./|/etc/(?:passwd|shadow)|<\?php|\$\{jndi:|<script|javascript:|\bunion\b.{0,20}\bselect\b|'\s*or\s*'?\d|\(\s*[&|!]\s*\(|\$(?:ne|gt|where)\b|\{\{.*\}\}|<!--\s*#)" "t:base64Decode"
