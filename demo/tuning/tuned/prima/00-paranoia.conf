# PRIMA delle regole: qui si configura il motore.
#
# Al livello 1, quello di default, il CRS e' prudente: prende gli attacchi
# veri e quasi mai il traffico onesto. Alzando la paranoia copri di piu' e
# cominci a pagarlo in falsi positivi. E' il compromesso vero del mestiere.
#
# ATTENZIONE AL NOME: nel CRS v4 la variabile e' tx.blocking_paranoia_level.
# Il vecchio tx.paranoia_level del CRS 3 viene accettato senza errori e
# ignorato: sembra funzionare e non fa niente.
SecAction "id:900000,phase:1,nolog,pass,t:none,setvar:tx.blocking_paranoia_level=3,setvar:tx.detection_paranoia_level=3"
